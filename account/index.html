<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My account – Lucrum</title>
  <script src="../js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/link.css" />
</head>
<body>
  <div class="shell shell-wide">
    <header class="site-header">
      <div class="brand">
        <h1><a href="../index.html">Lucrum</a></h1>
        <p>Bazaar intelligence for Hypixel SkyBlock</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
        Dark mode
      </button>
    </header>
    <nav class="site-nav">
      <a href="../signals/">Signals</a>
      <a href="../calendar/">Calendar</a>
      <a href="../account/" aria-current="page">My account</a>
      <a href="../link/">Link account</a>
    </nav>

    <main>
      <div id="signin-slot" class="card link-card" hidden>
        <h2>Sign in</h2>
        <p class="dim">
          Sign in with MC-ID to view your own portfolio and set whether it's public.
        </p>
        <button class="btn btn-primary" id="signin-btn" type="button">Sign in with MC-ID</button>
        <p class="error-text" id="signin-error" hidden></p>
      </div>

      <div id="privacy-slot"></div>
      <div id="profile-slot"></div>
    </main>

    <footer class="site-footer">
      <p><a href="../index.html">Back to Lucrum</a></p>
    </footer>
  </div>

  <script type="module" src="../js/account.js"></script>
</body>
</html>
