<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item – Lucrum</title>
  <script src="../js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="shell shell-wide">
    <header class="site-header">
      <div class="brand">
        <h1><a href="../index.html">Lucrum</a></h1>
        <p>Bazaar intelligence for Hypixel SkyBlock</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
        Dark mode
      </button>
    </header>
    <nav class="site-nav">
      <a href="../signals/">Signals</a>
      <a href="../calendar/">Calendar</a>
      <a href="../account/">My account</a>
      <a href="../link/">Link account</a>
    </nav>

    <main>
      <h2 class="item-title" id="item-title">&nbsp;</h2>

      <div class="range-tabs" id="range-tabs" role="tablist" aria-label="Chart range">
        <button class="type-tab" data-range="1h" type="button" aria-pressed="false">1h</button>
        <button class="type-tab" data-range="1d" type="button" aria-pressed="true">1d</button>
        <button class="type-tab" data-range="1w" type="button" aria-pressed="false">1w</button>
        <button class="type-tab" data-range="1M" type="button" aria-pressed="false">1M</button>
        <button class="type-tab" data-range="3M" type="button" aria-pressed="false">3M</button>
        <button class="type-tab" data-range="6M" type="button" aria-pressed="false">6M</button>
      </div>

      <div class="card chart-card" id="chart-card">
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
        </div>
        <div class="chart-legend">
          <span><span class="swatch" style="background:var(--gain)"></span>Buy side (history)</span>
          <span><span class="swatch" style="background:var(--loss)"></span>Sell side (history)</span>
          <span><span class="swatch" style="background:var(--brass)"></span>Prediction</span>
          <span><span class="swatch" style="background:var(--brass-dim)"></span>Uncertainty band</span>
        </div>
      </div>

      <p class="confidence-note" id="confidence-note"></p>
      <div id="event-notes"></div>
    </main>

    <footer class="site-footer">
      <p><a href="../signals/">Back to signals</a></p>
    </footer>
  </div>

  <script type="module" src="../js/item.js"></script>
</body>
</html>
