<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market – Lucrum</title>
  <meta name="description" content="Lucrum – bazaar intelligence for Hypixel SkyBlock." />
  <!-- Theme resolution must run before css/main.css paints, per docs/BRAND.md's theme section –
       see js/theme.js's top-of-file comment for why this is a plain script, not a module. -->
  <script src="../js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />

</head>
<body data-base="../">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="../index.html"><span class="tick">&#9642;</span> Lucrum</a>
      <nav class="topnav" aria-label="Primary">
        <a href="../market/" aria-current="page">Market</a>
        <a href="../signals/">Signals</a>
        <a href="../calendar/">Calendar</a>
        <a href="../account/">Portfolio</a>
        <a href="../status/">Status</a>
      </nav>
      <div class="topbar-actions">
        <button class="search-trigger" id="search-trigger" type="button" aria-label="Find a bazaar item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <span class="search-label">Find an item</span>
          <span class="kbd">&#8984;K</span>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button"></button>
      </div>
    </div>
  </div>

  <div class="shell">
    <div class="status-strip" id="status-strip"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Market</h1>
          <p class="sub">
            Every product in the worker's latest bazaar snapshot. Sort any column; click a row for
            its chart, prediction and model check.
          </p>
        </div>
      </div>

      <div class="market-controls">
        <input class="input" id="market-search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Filter by name or id" aria-label="Filter products" />
        <div class="tabs" id="market-filters" role="group" aria-label="Volume filter">
          <button class="tab" data-filter="all" aria-pressed="true" type="button">All</button>
          <button class="tab" data-filter="10k" aria-pressed="false" type="button">Weekly vol &gt; 10k</button>
          <button class="tab" data-filter="1m" aria-pressed="false" type="button">Weekly vol &gt; 1M</button>
        </div>
        <span class="result-count" id="result-count"></span>
      </div>

      <div id="market-slot"><p class="loading-state">Loading the bazaar snapshot&hellip;</p></div>
    </main>

    <footer class="site-footer">
      <span>Bazaar intelligence for Hypixel SkyBlock</span>
      <a href="../link/">Link your account</a>
      <a href="../status/">Worker status</a>
      <a href="https://seyvault.github.io" rel="noopener">SeyVault</a>
    </footer>
  </div>

  <script type="module" src="../js/market.js"></script>
</body>
</html>
