<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signals – Lucrum</title>
  <script src="../js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <h1><a href="../index.html">Lucrum</a></h1>
        <p>Bazaar intelligence for Hypixel SkyBlock</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">
        Dark mode
      </button>
    </header>
    <nav class="site-nav">
      <a href="../signals/" aria-current="page">Signals</a>
      <a href="../calendar/">Calendar</a>
      <a href="../account/">My account</a>
      <a href="../link/">Link account</a>
    </nav>

    <main>
      <div id="hero-slot">
        <p class="loading-state">Loading the current best signal&hellip;</p>
      </div>

      <div class="type-tabs" id="type-tabs" role="tablist" aria-label="Signal type">
        <button class="type-tab" data-type="position" aria-pressed="true" type="button">Position</button>
        <button class="type-tab" data-type="spread" aria-pressed="false" type="button">Spread</button>
        <button class="type-tab" data-type="craft" aria-pressed="false" type="button">Craft</button>
        <button class="type-tab" data-type="event" aria-pressed="false" type="button">Event</button>
      </div>

      <div id="table-slot">
        <p class="loading-state">Loading signals&hellip;</p>
      </div>
    </main>

    <footer class="site-footer">
      <p>Score is comparable within a signal type, not across types. <a href="../index.html">Back to Lucrum</a></p>
    </footer>
  </div>

  <script type="module" src="../js/signals.js"></script>
</body>
</html>
